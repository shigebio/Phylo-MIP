name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish release image
    runs-on: ubuntu-latest
    environment:
      name: dockerhub
    steps:
      - name: Check out the release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Resolve release image tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            image_tag="$EVENT_TAG"
            prerelease="$EVENT_PRERELEASE"
          else
            image_tag="$REF_NAME"
            prerelease="false"
          fi

          if [[ ! "$image_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic version tag such as v0.1.1 must be selected for publishing." >&2
            exit 1
          fi

          latest=false
          if [[ "$prerelease" != "true" && "$image_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest=true
          fi

          {
            echo "image_tag=$image_tag"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Current repository setting retained pending DockerHub destination confirmation.
          images: shigebio/micum
          tags: |
            type=raw,value=${{ steps.release.outputs.image_tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: shigebio/micum
          readme-filepath: ./README.md
          short-description: ${{ github.event.repository.description }}
